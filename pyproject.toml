[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llama"
version = "1.0.0"
description = "LBANN Llama inference library"
readme = "README.md"
license = {file = "LICENSE"}
dependencies = [
    "torch>=2.5",
    "uvicorn",
    "transformers>=4.52.0dev0",
    "tokenizers",
    "safetensors",
    "openai",
    "accelerate",
    "fastapi",
    "compressed-tensors",
]

[project.urls]
Repository = "https://github.com/LBANN/llama.git"
